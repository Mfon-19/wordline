<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worldline</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<header>
  <h1>Worldline</h1>
  <select id="clip" aria-label="Clip"></select>
  <label class="knob">Haze <input id="haze" type="range" min="0" max="1" step="0.01" value="0.35"></label>
  <span id="status"></span>
</header>
<main>
  <div id="stage"><canvas id="view"></canvas></div>
  <aside>
    <h2>Animals found</h2>
    <ol id="tracks"></ol>
    <p id="empty" hidden>Nothing found in this clip.</p>
  </aside>
</main>
<footer>
  <button id="play" aria-label="Play or pause">▶</button>
  <div id="timeline">
    <div id="bars"></div>
    <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Time">
  </div>
  <output id="clock">0.0 s</output>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
