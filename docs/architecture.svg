<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' width='1500' height='1000' font-family='-apple-system, Helvetica Neue, sans-serif'><rect width='1200' height='800' fill='white'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#7d848d'/></marker></defs><text x='30' y='42' font-size='22' font-weight='700' fill='#1d2126' text-anchor='start'>Worldline architecture</text><text x='30' y='66' font-size='13' fill='#5c636c' text-anchor='start'>OpenCV 5 turns each clip into animal tubes; one Graviton4 server behind CloudFront serves them.</text><rect x='250' y='92' width='920' height='684' rx='12' fill='none' stroke='#c3c8ce' stroke-width='1.25' stroke-dasharray='6 5'/><rect x='266' y='104' width='10' height='10' rx='2' fill='#d9822b'/><text x='284' y='114' font-size='12' font-weight='600' fill='#1d2126' text-anchor='start'>AWS · us-east-1 · one CloudFormation stack</text><rect x='30' y='150' width='196' height='116' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='44' y='174' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>Visitor's browser</text><text x='44' y='194' font-size='12' fill='#5c636c' text-anchor='start'>Three.js block viewer</text><text x='44' y='211' font-size='12' fill='#5c636c' text-anchor='start'>Search by word</text><text x='44' y='228' font-size='12' fill='#5c636c' text-anchor='start'>Upload a clip</text><rect x='276' y='150' width='180' height='116' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='290' y='174' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>CloudFront</text><text x='290' y='194' font-size='12' fill='#5c636c' text-anchor='start'>HTTPS, the one way in</text><text x='290' y='211' font-size='12' fill='#5c636c' text-anchor='start'>Caches viewer, frames</text><text x='290' y='228' font-size='12' fill='#5c636c' text-anchor='start'>/api/* to the server</text><path d='M226 222H272' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='482' y='132' width='672' height='470' rx='10' fill='none' stroke='#c3c8ce' stroke-width='1.25' stroke-dasharray='3 4'/><text x='1140' y='150' font-size='11' fill='#5c636c' text-anchor='end'>Security group: CloudFront addresses only</text><rect x='500' y='162' width='636' height='424' rx='8' fill='#f4f5f7' stroke='#a3a9b1' stroke-width='1.25'/><text x='516' y='186' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>EC2 m8g.large · Graviton4 · Docker</text><path d='M456 222H512' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='462' y='240' font-size='11' fill='#5c636c' text-anchor='start'>port 80</text><rect x='516' y='202' width='604' height='42' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='532' y='228' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>FastAPI server</text><text x='660' y='228' font-size='12' fill='#5c636c' text-anchor='start'>viewer · frames · search · uploads</text><rect x='516' y='262' width='604' height='156' rx='8' fill='#eaf1fd' stroke='#2563c9' stroke-width='1.6'/><text x='532' y='286' font-size='14' font-weight='700' fill='#2563c9' text-anchor='start'>OpenCV 5 pipeline</text><text x='1104' y='286' font-size='11' fill='#5c636c' text-anchor='end'>runs on every clip and upload</text><rect x='532' y='300' width='86' height='102' rx='6' fill='white' stroke='#9db8e6' stroke-width='1.25'/><text x='541' y='321' font-size='12.5' font-weight='600' fill='#1d2126' text-anchor='start'>Decode</text><text x='541' y='341' font-size='10.5' fill='#5c636c' text-anchor='start'>VideoCapture</text><text x='541' y='357' font-size='10.5' fill='#5c636c' text-anchor='start'>resize</text><text x='541' y='373' font-size='10.5' fill='#5c636c' text-anchor='start'>≤ 10 fps</text><path d='M618 351H628' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='629' y='300' width='86' height='102' rx='6' fill='white' stroke='#9db8e6' stroke-width='1.25'/><text x='638' y='321' font-size='12.5' font-weight='600' fill='#1d2126' text-anchor='start'>Detect</text><text x='638' y='341' font-size='10.5' fill='#5c636c' text-anchor='start'>cv2.dnn</text><text x='638' y='357' font-size='10.5' fill='#5c636c' text-anchor='start'>MegaDetector</text><text x='638' y='373' font-size='10.5' fill='#5c636c' text-anchor='start'>every 3rd</text><path d='M715 351H725' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='726' y='300' width='86' height='102' rx='6' fill='white' stroke='#9db8e6' stroke-width='1.25'/><text x='735' y='321' font-size='12.5' font-weight='600' fill='#1d2126' text-anchor='start'>Motion</text><text x='735' y='341' font-size='10.5' fill='#5c636c' text-anchor='start'>median bg</text><text x='735' y='357' font-size='10.5' fill='#5c636c' text-anchor='start'>absdiff</text><text x='735' y='373' font-size='10.5' fill='#5c636c' text-anchor='start'>components</text><path d='M812 351H822' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='823' y='300' width='86' height='102' rx='6' fill='white' stroke='#9db8e6' stroke-width='1.25'/><text x='832' y='321' font-size='12.5' font-weight='600' fill='#1d2126' text-anchor='start'>Track</text><text x='832' y='341' font-size='10.5' fill='#5c636c' text-anchor='start'>Lucas-Kanade</text><text x='832' y='357' font-size='10.5' fill='#5c636c' text-anchor='start'>optical flow</text><text x='832' y='373' font-size='10.5' fill='#5c636c' text-anchor='start'>scene cuts</text><path d='M909 351H919' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='920' y='300' width='86' height='102' rx='6' fill='white' stroke='#9db8e6' stroke-width='1.25'/><text x='929' y='321' font-size='12.5' font-weight='600' fill='#1d2126' text-anchor='start'>Outline</text><text x='929' y='341' font-size='10.5' fill='#5c636c' text-anchor='start'>grabCut</text><text x='929' y='357' font-size='10.5' fill='#5c636c' text-anchor='start'>findContours</text><text x='929' y='373' font-size='10.5' fill='#5c636c' text-anchor='start'>moments</text><path d='M1006 351H1016' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='1017' y='300' width='86' height='102' rx='6' fill='white' stroke='#9db8e6' stroke-width='1.25'/><text x='1026' y='321' font-size='12.5' font-weight='600' fill='#1d2126' text-anchor='start'>Measure</text><text x='1026' y='341' font-size='10.5' fill='#5c636c' text-anchor='start'>dwell, path</text><text x='1026' y='357' font-size='10.5' fill='#5c636c' text-anchor='start'>frame atlas</text><text x='1026' y='373' font-size='10.5' fill='#5c636c' text-anchor='start'>animal crops</text><rect x='516' y='436' width='180' height='132' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='530' y='460' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>Upload queue</text><text x='530' y='480' font-size='12' fill='#5c636c' text-anchor='start'>60 s · 50 MB</text><text x='530' y='497' font-size='12' fill='#5c636c' text-anchor='start'>rate-limited</text><text x='530' y='514' font-size='12' fill='#5c636c' text-anchor='start'>one clip at a time</text><text x='530' y='531' font-size='12' fill='#5c636c' text-anchor='start'>video deleted after</text><rect x='712' y='436' width='196' height='132' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='726' y='460' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>EmbeddingGemma 2</text><text x='726' y='480' font-size='12' fill='#5c636c' text-anchor='start'>PyTorch · bfloat16</text><text x='726' y='497' font-size='12' fill='#5c636c' text-anchor='start'>crops → tube vectors</text><text x='726' y='514' font-size='12' fill='#5c636c' text-anchor='start'>word vs 26 names</text><text x='726' y='531' font-size='12' fill='#5c636c' text-anchor='start'>= confident or not</text><rect x='924' y='436' width='196' height='132' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='938' y='460' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>Results per clip</text><text x='938' y='480' font-size='12' fill='#5c636c' text-anchor='start'>worldline.json  tubes</text><text x='938' y='497' font-size='12' fill='#5c636c' text-anchor='start'>atlas.jpg  frames</text><text x='938' y='514' font-size='12' fill='#5c636c' text-anchor='start'>embeddings.json</text><text x='938' y='531' font-size='12' fill='#5c636c' text-anchor='start'>served to the viewer</text><path d='M606 436V422' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='614' y='431' font-size='11' fill='#5c636c' text-anchor='start'>process</text><path d='M810 418V432' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='818' y='431' font-size='11' fill='#5c636c' text-anchor='start'>crops</text><path d='M1022 418V432' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='1030' y='431' font-size='11' fill='#5c636c' text-anchor='start'>tubes</text><path d='M908 502H920' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><rect x='276' y='664' width='196' height='78' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='290' y='688' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>Private S3 bucket</text><text x='290' y='708' font-size='12' fill='#5c636c' text-anchor='start'>app bundle, encrypted</text><text x='290' y='725' font-size='12' fill='#5c636c' text-anchor='start'>server pulls on deploy</text><rect x='490' y='664' width='196' height='78' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='504' y='688' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>IAM role + SSM</text><text x='504' y='708' font-size='12' fill='#5c636c' text-anchor='start'>least privilege</text><text x='504' y='725' font-size='12' fill='#5c636c' text-anchor='start'>no keys, no SSH port</text><rect x='704' y='664' width='196' height='78' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='718' y='688' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>CloudWatch Logs</text><text x='718' y='708' font-size='12' fill='#5c636c' text-anchor='start'>JSON lines</text><text x='718' y='725' font-size='12' fill='#5c636c' text-anchor='start'>kept 14 days</text><rect x='918' y='664' width='236' height='78' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='932' y='688' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>AWS Budgets</text><text x='932' y='708' font-size='12' fill='#5c636c' text-anchor='start'>$50 a month, email alerts</text><text x='932' y='725' font-size='12' fill='#5c636c' text-anchor='start'>IMDSv2, encrypted disk</text><path d='M374 664V560H496' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='384' y='552' font-size='11' fill='#5c636c' text-anchor='start'>app bundle</text><path d='M588 664V586' fill='none' stroke='#7d848d' stroke-width='1.4'/><path d='M802 586V660' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='810' y='626' font-size='11' fill='#5c636c' text-anchor='start'>logs</text><rect x='30' y='470' width='196' height='116' rx='8' fill='white' stroke='#a3a9b1' stroke-width='1.25'/><text x='44' y='494' font-size='14' font-weight='600' fill='#1d2126' text-anchor='start'>Curated clips</text><text x='44' y='514' font-size='12' fill='#5c636c' text-anchor='start'>20 Wikimedia Commons</text><text x='44' y='531' font-size='12' fill='#5c636c' text-anchor='start'>clips, processed by the</text><text x='44' y='548' font-size='12' fill='#5c636c' text-anchor='start'>same pipeline before</text><text x='44' y='565' font-size='12' fill='#5c636c' text-anchor='start'>deploy</text><path d='M128 586V703H272' fill='none' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='140' y='694' font-size='11' fill='#5c636c' text-anchor='start'>in the bundle</text><rect x='30' y='316' width='12' height='12' rx='3' fill='#eaf1fd' stroke='#2563c9' stroke-width='1.4'/><text x='50' y='326' font-size='12' fill='#1d2126' text-anchor='start'>OpenCV 5</text><rect x='30' y='340' width='12' height='12' rx='3' fill='none' stroke='#c3c8ce' stroke-dasharray='3 2'/><text x='50' y='350' font-size='12' fill='#1d2126' text-anchor='start'>AWS / network boundary</text><path d='M30 374H44' stroke='#7d848d' stroke-width='1.4' marker-end='url(#a)'/><text x='50' y='378' font-size='12' fill='#1d2126' text-anchor='start'>data flow</text></svg>